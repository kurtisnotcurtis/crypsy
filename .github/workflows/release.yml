name: Release Crypsy Note

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag matches package.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PKG_VERSION" ]; then
            echo "Release tag ($RELEASE_TAG) does not match package.json version (v$PKG_VERSION)!" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Crypsy-Portable.html, run tests & prepare Capacitor web assets
        run: |
          npm run build
          npm test
          npm run cap:prepare
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Decode Android signing keystore (required)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android release signing secrets are missing; refusing to publish an unsigned APK." >&2
            exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/crypsy-release.jks"
          echo "keystore_path=$RUNNER_TEMP/crypsy-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        working-directory: android
        env:
          CRYPSY_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          CRYPSY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CRYPSY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRYPSY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Wipe Android signing keystore from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/crypsy-release.jks"

      - name: Stage Release Assets & Generate SHA-256 Checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          cp Crypsy-Portable.html release-assets/Crypsy-Portable.html
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-assets/Crypsy-${RELEASE_TAG}-android.apk"
          else
            echo "Signed release APK not found!" >&2
            exit 1
          fi
          (cd release-assets && sha256sum Crypsy-Portable.html "Crypsy-${RELEASE_TAG}-android.apk" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/Crypsy-Portable.html
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Crypsy Note ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/Crypsy-Portable.html
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
