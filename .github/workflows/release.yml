name: Release Crypsy Note

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag matches package.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PKG_VERSION" ]; then
            echo "Release tag ($RELEASE_TAG) does not match package.json version (v$PKG_VERSION)!" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Crypsy-Portable.html, run tests & prepare Capacitor web assets
        run: |
          npm run build
          npm test
          npm run cap:prepare
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@99b10b337bffc4e945722320c45169a83850123f # v4.4.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Decode Android signing keystore (required)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android release signing secrets are missing; refusing to publish an unsigned APK." >&2
            exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/crypsy-release.jks"
          echo "keystore_path=$RUNNER_TEMP/crypsy-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        working-directory: android
        env:
          CRYPSY_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          CRYPSY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CRYPSY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRYPSY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Wipe Android signing keystore from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/crypsy-release.jks"

      - name: Stage Release Assets & Generate SHA-256 Checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          cp Crypsy-Portable.html release-assets/Crypsy-Portable.html
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-assets/Crypsy-${RELEASE_TAG}-android.apk"
          else
            echo "Signed release APK not found!" >&2
            exit 1
          fi
          (cd release-assets && sha256sum Crypsy-Portable.html "Crypsy-${RELEASE_TAG}-android.apk" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            release-assets/Crypsy-Portable.html
            release-assets/*.apk
            release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Crypsy Note ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/Crypsy-Portable.html
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
